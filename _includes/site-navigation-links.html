<ul class="site-nav__links">
  {% for link in site.data.navigation.main %}
    <li>
      <a href="{% if link.url contains '://' %}{{ link.url }}{% else %}{{ link.url | relative_url }}{% endif %}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
    </li>
  {% endfor %}
</ul>
