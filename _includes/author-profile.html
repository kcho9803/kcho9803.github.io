{% assign author = site.author %}
<div class="author-profile" itemscope itemtype="https://schema.org/Person">
  {% if author.avatar %}
  <div class="author__avatar">
    <img src="{{ author.avatar | prepend: '/images/' | relative_url }}" alt="{{ author.name }}">
  </div>
  {% else %}
  <div class="author__initials" aria-hidden="true">{{ author.initials }}</div>
  {% endif %}
  <div class="author__content">
    <h3 class="author__name" itemprop="name">{{ author.name }}</h3>
    <p class="author__bio">{{ author.bio }}</p>
  </div>
  <div class="author__urls-wrapper">
    <button class="btn btn--inverse" aria-label="Show profile links">Links</button>
    <ul class="author__urls social-icons">
      <li><i class="fas fa-fw fa-map-marker-alt" aria-hidden="true"></i> {{ author.location }}</li>
      {% if author.email %}<li><a href="mailto:{{ author.email }}"><i class="fas fa-fw fa-envelope" aria-hidden="true"></i> Email</a></li>{% endif %}
      <li><a href="https://github.com/{{ author.github }}"><i class="fab fa-fw fa-github" aria-hidden="true"></i> GitHub</a></li>
      <li><a href="{{ author.orcid }}"><i class="ai ai-orcid ai-fw" aria-hidden="true"></i> ORCID</a></li>
      <li><a href="https://www.linkedin.com/in/{{ author.linkedin }}/"><i class="fab fa-fw fa-linkedin" aria-hidden="true"></i> LinkedIn</a></li>
    </ul>
  </div>
</div>
