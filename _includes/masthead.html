{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <a class="site-wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main navigation">
        {% include site-navigation-links.html %}
      </nav>
      <details class="site-menu">
        <summary>Menu</summary>
        <nav class="site-menu__panel" aria-label="Main navigation">
          {% include site-navigation-links.html %}
        </nav>
      </details>
      <select id="site-theme" class="site-theme" aria-label="Color theme" title="Color theme" hidden>
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
  </div>
</div>
