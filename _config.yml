# Public website settings. Everything committed to this repository is public.
locale: "en-US"
title: "Kyungchan Cho"
title_separator: "-"
name: "Kyungchan Cho"
description: "Physics PhD student at Purdue University studying local decoding and autonomous error correction in topological quantum memories."
url: "https://kcho9803.github.io"
baseurl: ""
repository: "kcho9803/kcho9803.github.io"
timezone: America/Indiana/Indianapolis
breadcrumbs: false
words_per_minute: 160
read_more: "disabled"

# These settings control output; they do not make committed source private.
future: false
show_drafts: false
unpublished: false
comments:
  provider: false
analytics:
  provider: false

author:
  name: "Kyungchan Cho"
  initials: "KC"
  avatar: "profile.jpg"
  bio: "Physics PhD student at Purdue University"
  location: "West Lafayette, Indiana"
  email: "cho615@purdue.edu"
  github: "kcho9803"
  linkedin: "kyungchan-cho-388b48312"
  orcid: "https://orcid.org/0000-0002-7963-0165"
social:
  type: Person
  name: "Kyungchan Cho"
  links:
    - "https://orcid.org/0000-0002-7963-0165"
    - "https://github.com/kcho9803"
    - "https://www.linkedin.com/in/kyungchan-cho-388b48312/"

include:
  - _pages
exclude:
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - .tools
  - .venv
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - RESEARCH_BRIEF_HANDOFF.md
  - docs
  - scripts
  - private
  - node_modules
  - package.json
  - package-lock.json
  - vendor
  - tmp
  - log
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  publications:
    output: true
    permalink: /publications/:path/
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      comments: false
      share: false

sass:
  sass_dir: _sass
  style: compressed
permalink: /writing/:title/
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
compress_html:
  clippings: all
  ignore:
    envs: development
